# Harbor overlay: adds the CheguersDB MCP memory server next to the task
# container. Passed with `harbor run --extra-docker-compose <this file>`.
#
# - One sidecar per trial, so every attempt starts with an empty memory.
# - CHEGUERS_BACKEND selects the arm: cheguers | vector-only | notes.
# - Telemetry (<container>-<timestamp>-<pid>.jsonl) lands in the trial's agent
#   log dir (jobs/<job>/<trial>/agent/), exposed by Harbor as HOST_AGENT_LOGS_PATH.
services:
  cheguers:
    image: ${CHEGUERS_MCP_IMAGE:-cheguers-mcp:latest}
    pull_policy: never
    environment:
      CHEGUERS_BACKEND: ${CHEGUERS_BACKEND:-cheguers}
      CHEGUERS_TELEMETRY_DIR: /telemetry
    volumes:
      - ${HOST_AGENT_LOGS_PATH:-/tmp/cheguers-telemetry}:/telemetry
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      start_period: 20s
      retries: 30
  main:
    depends_on:
      cheguers:
        condition: service_healthy
