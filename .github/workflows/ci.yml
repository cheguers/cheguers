name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  mcp-image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build MCP sidecar image
        run: docker build -f packages/mcp/Dockerfile -t cheguers-mcp:ci .
      - name: Smoke test /health and MCP initialize
        run: |
          docker run -d --name mcp -p 8765:8765 cheguers-mcp:ci
          for i in $(seq 1 30); do curl -fsS localhost:8765/health && break; sleep 2; done
          curl -fsS localhost:8765/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          docker logs mcp
